:root{--or:#FF831D;--or-deep:#C45200;--yel:#FFE311;--cream:#FFFDF6;--peach:#F7DDC5;--pale:#FFF4DC;--kinari:#FFFDF6;--kinari-2:#FFF4DC;--tsuchi:#C45200;--midori:#FF831D;--kaki:#C45200;--line:#F7DDC5;--pop-font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
body{background:var(--cream);font-family:var(--pop-font)}
h1,h2,h3,.serif,.brand,.lead,.seed-number{font-family:var(--pop-font);font-weight:700}
.header{background:#fff;border-bottom:4px solid var(--or)}
.brand{color:var(--or-deep)}
h1,h2{width:fit-content;max-width:100%;background:linear-gradient(transparent 64%,var(--yel) 64%);padding:0 .15em}
.label{color:var(--or-deep)}
a:focus-visible,button:focus-visible{outline-color:var(--or)}
.section{border-top:2px dashed var(--peach)}
.button{background:var(--or);border:0;color:#fff;border-radius:999px;box-shadow:0 4px 0 var(--or-deep);font-size:15px}
.button:hover{background:var(--or-deep);transform:translateY(2px);box-shadow:0 2px 0 var(--or-deep)}
.seed,.stage,.contact{border-radius:24px}
.seed{background:#fff;border:2px solid var(--peach);box-shadow:6px 6px 0 var(--yel)}
.seed-number{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--or);color:#fff;font-size:24px}
.stage{background:#fff;border:2px solid var(--peach);border-top:6px solid var(--or);padding:22px 20px}
.grain{background:var(--pale);border:2px solid var(--or);border-radius:999px}
.grain span{color:#333}
.grain:hover{background:var(--yel);border-color:var(--or)}
.contact{background:#FFFFD5;border:2px solid var(--yel)}
.footer{background:var(--or);color:#fff}
.footer a{color:#fff}
.komari{list-style:none;padding:0;margin:28px 0;display:grid;gap:14px}
.komari li{background:#fff;border:2px solid var(--peach);border-radius:999px;padding:14px 24px;font-weight:700;font-size:18px;width:fit-content;max-width:100%}
.komari li::before{content:"？";color:var(--or);margin-right:.5em}
.kotae{font-size:20px;font-weight:700;margin-top:28px}
.kotae strong{background:linear-gradient(transparent 60%,var(--yel) 60%)}
.story{background:#fff;border:2px solid var(--peach);border-radius:24px;padding:28px 24px;margin-top:32px;box-shadow:6px 6px 0 var(--yel)}
.story .label{margin-bottom:6px}
.story h3{margin-bottom:16px}
.story .turn{background:var(--pale);border-radius:16px;padding:16px 18px;margin-top:18px}
.seed .komari-link{font-size:14px;margin-top:14px}
.seed .komari-link a{color:var(--or-deep);font-weight:700}
