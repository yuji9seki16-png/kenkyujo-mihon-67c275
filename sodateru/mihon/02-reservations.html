round:#fff;transition:width .3s}.check{width:100%;display:flex;align-items:center;gap:14px;text-align:left}.box{width:22px;height:22px;flex-shrink:0;border:1px solid var(--accent);display:inline-grid;place-items:center}.check[aria-pressed=true] .box{background:#fff;color:#333}.video{aspect-ratio:16/9;background:#fff;display:grid;place-items:center;border:1px solid var(--line);position:relative;margin-bottom:20px}.video .cardtitle{font:26px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);padding:18px;color:#333}.caption{background:#fff;color:#333;padding:14px 18px;min-height:90px}.footer{border-top:1px solid var(--line);margin-top:38px;padding:18px 0;font-size:12px;color:#333}.footer nav{display:flex;gap:14px;justify-content:space-between;margin-bottom:14px}.empty{padding:20px 0;color:#333}form{display:flex;gap:8px}form input{flex:1}.status{min-height:30px;color:var(--accent);font-size:13px;margin:12px 0} .step{display:inline-block;padding:4px 8px;margin:6px 4px 6px 0;background:#fff;font-size:12px}.step.done{background:#fff;color:#333}@media(max-width:700px){.wrap{padding:18px 18px}.mast{padding:27px 0 24px}.grid{grid-template-columns:1fr}.panel{padding:19px}.calendar{grid-template-columns:repeat(3,1fr)}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:flex-start}.cross button{padding:16px;min-height:130px}.title{gap:12px}.tag{font-size:10px}.number{font-size:29px}.lead{font-size:14px}.row{gap:10px}form{flex-wrap:wrap}form button{flex-shrink:0}.video .cardtitle{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"></head><body><div class="wrap"><div class="top"><a href="../tane/02-reservations.html">← 種のページへ</a><span class="tag">見本・架空のデータです</span></div><header class="mast"><div class="title"><h1>予約管理表</h1></div><p class="real-link"><a href="../kamoshika/reservation.html"><span aria-hidden="true">▸</span> カモシカの実物を見る →</a></p><p class="lead">予約の受け漏れ・重なりを防ぐ</p></header><main><div class="intro"><span>燻製料理の食堂・工房・燻製マルシェ・卸・燻製ワークショップ（日英）・オンライン燻製教室。</span></div><div class="tabs" id="dates"></div><div class="grid"><section class="panel"><h2 id="dateTitle"></h2><p class="muted">食堂は各回12席、ワークショップは各回6名。枠ごとに空きを確認します。</p><div id="slots"></div></section><section class="panel"><h2>予約を受ける</h2><label>予約枠 <select id="time"></select></label><label> 人数 <select id="party"><option value="1">1名</option><option value="2" selected>2名</option><option value="3">3名</option></select></label><p><button class="primary" id="book">予約を入れる</button></p><p id="notice" class="status" role="status"></p><div class="note">HP・電話で受けた予約を同じ一覧へ。実際の予約・送信はしません。</div></section></div><section class="panel"><h2>予約一覧・当日の台帳</h2><div class="table-scroll" tabindex="0" role="region" aria-label="予約一覧。横にスクロールできます"><table><thead><tr><th>日付</th><th>枠</th><th>人数</th><th>お客様</th><th>受付</th><th>担当</th><th>メモ</th></tr></thead><tbody id="reservationRows"></tbody></table></div></section></main><footer class="footer"><nav aria-label="ほかの見本"><a href="01-cross.html">← 前の見本</a><span>2 / 11</span><a href="03-video.html">次の見本 →</a></nav>燻製食堂クワガタは架空のお店です。人名・数値・記録はすべて見本用です。<br>操作はこの画面だけに反映されます。再読み込みすると元に戻ります。</footer></div><script>
'use strict';
const $=s=>document.querySelector(s);
const slots=[['食堂 11:30',12,'厨房A・接客B'],['食堂 13:00',12,'厨房A・接客B'],['燻製ワークショップ 日本語 15:00',6,'講師C'],['燻製ワークショップ English 17:00',6,'講師D']];
const reservations=[{day:0,slot:0,n:2,name:'木○さん',via:'HP',memo:'燻製チーズを試したい'},{day:0,slot:1,n:3,name:'岩○さん',via:'電話',memo:'食後にマルシェで買い物'},{day:0,slot:2,n:4,name:'宮○さん',via:'HP',memo:'チップ選びは初めて'},{day:0,slot:3,n:5,name:'見本のお客様A',via:'HP',memo:'English / 初参加'},{day:1,slot:0,n:4,name:'木○さん',via:'電話',memo:'同僚と昼食'},{day:2,slot:2,n:2,name:'宮○さん',via:'HP',memo:'家庭用の道具を持参'}];
let day=0;
$('#time').innerHTML=slots.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('');
function draw(){
 $('#dates').innerHTML=[0,1,2].map(i=>`<button data-day="${i}" class="${day===i?'active':''}" aria-pressed="${day===i}">11月${25+i}日</button>`).join('');
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;$('#notice').textContent='';draw()});
 $('#dateTitle').textContent=`11月${25+day}日の席と講座`;
 $('#slots').innerHTML=slots.map((s,i)=>{const rows=reservations.filter(r=>r.day===day&&r.slot===i),n=rows.reduce((t,r)=>t+r.n,0);return `<div class="listrow"><div class="row"><strong>${s[0]}</strong><span class="pill ${n===s[1]?'warn':'good'}">空き ${s[1]-n} / ${s[1]}名</span></div><p class="muted">${rows.map(r=>r.name+' '+r.n+'名').join(' ／ ')||'予約はまだありません'}</p></div>`}).join('');
 $('#reservationRows').innerHTML=reservations.filter(r=>r.day===day).sort((a,b)=>a.slot-b.slot).map(r=>`<tr${r.added?' class="new"':''}><td>11/${25+r.day}</td><td>${slots[r.slot][0]}</td><td>${r.n}名</td><td>${r.name}</td><td>${r.via}</td><td>${slots[r.slot][2]}</td><td>${r.memo}</td></tr>`).join('');
}
$('#book').onclick=()=>{const slot=+$('#time').value,n=+$('#party').value,used=reservations.filter(r=>r.day===day&&r.slot===slot).reduce((t,r)=>t+r.n,0);if(used+n>slots[slot][1]){$('#notice').textContent='定員を超えます。別の枠をご案内ください。';return}reservations.push({day,slot,n,name:'見本のお客様B',via:'電話',memo:'当日の受付分',added:true});draw();$('#notice').textContent='選んだ枠と当日の台帳に予約を追加しました。'};
draw();
</script></body></html>
