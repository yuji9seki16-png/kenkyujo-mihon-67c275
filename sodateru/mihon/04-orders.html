border:1px solid var(--line);border-radius:0;padding:25px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.muted{color:#333;font-size:13px}.small{font-size:12px}.pill{display:inline-block;border:1px solid var(--line);padding:2px 9px;border-radius:0;font-size:12px}.good{background:#fff;color:#333}.warn{background:#fff;color:#c00000}.note{border-left:0;padding:12px 16px;background:#fff;margin:18px 0 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.metric{font:42px/1.3 "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:var(--accent)}.rule{border:0;border-top:1px solid var(--line);margin:20px 0}.listrow{padding:16px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.seat{width:30px;height:30px;display:inline-block;border:1px solid var(--line);margin:4px 4px 0 0;background:#fff}.seat.filled{background:#fff;border-color:var(--accent)}.cross{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#fff;border:1px solid var(--accent)}.cross button{border:0;border-radius:0;background:#fff;min-height:140px;text-align:left;padding:25px}.cross button.active{background:#fff;color:var(--ink)}.cross span{display:block;color:var(--accent);font:24px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;margin-bottom:5px}.calendar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.calendar button{text-align:left;padding:14px 10px;min-height:90px}.calendar small{display:block;font-size:11px}.calendar strong{font-size:20px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{border:1px solid var(--line);padding:12px 8px;background:#fff;min-width:0}.day select{width:100%;padding:6px 2px;font-size:12px}.day label{font-size:11px;display:block;margin-top:10px}.progress{height:12px;border:1px solid var(--line);background:#fff;margin:18px 0}.progress>div{height:100%;background:#fff;transition:width .3s}.check{width:100%;display:flex;align-items:center;gap:14px;text-align:left}.box{width:22px;height:22px;flex-shrink:0;border:1px solid var(--accent);display:inline-grid;place-items:center}.check[aria-pressed=true] .box{background:#fff;color:#333}.video{aspect-ratio:16/9;background:#fff;display:grid;place-items:center;border:1px solid var(--line);position:relative;margin-bottom:20px}.video .cardtitle{font:26px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);padding:18px;color:#333}.caption{background:#fff;color:#333;padding:14px 18px;min-height:90px}.footer{border-top:1px solid var(--line);margin-top:38px;padding:18px 0;font-size:12px;color:#333}.footer nav{display:flex;gap:14px;justify-content:space-between;margin-bottom:14px}.empty{padding:20px 0;color:#333}form{display:flex;gap:8px}form input{flex:1}.status{min-height:30px;color:var(--accent);font-size:13px;margin:12px 0} .step{display:inline-block;padding:4px 8px;margin:6px 4px 6px 0;background:#fff;font-size:12px}.step.done{background:#fff;color:#333}@media(max-width:700px){.wrap{padding:18px 18px}.mast{padding:27px 0 24px}.grid{grid-template-columns:1fr}.panel{padding:19px}.calendar{grid-template-columns:repeat(3,1fr)}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:flex-start}.cross button{padding:16px;min-height:130px}.title{gap:12px}.tag{font-size:10px}.number{font-size:29px}.lead{font-size:14px}.row{gap:10px}form{flex-wrap:wrap}form button{flex-shrink:0}.video .cardtitle{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"></head><body><div class="wrap"><div class="top"><a href="../tane/04-orders.html">← 種のページへ</a><span class="tag">見本・架空のデータです</span></div><header class="mast"><div class="title"><h1>発注帳</h1></div><p class="real-link"><a href="../kamoshika/hacchu.html"><span aria-hidden="true">▸</span> カモシカの実物を見る →</a></p><p class="lead">足りないことに気づいた人が、その場で動ける</p></header><main><div class="intro"><span>燻製料理の食堂・工房・燻製マルシェ・卸・燻製ワークショップ（日英）・オンライン燻製教室。</span></div><div class="grid"><section class="panel"><h2>品目から、頼み方へ</h2><label for="search">品目・カテゴリ・使う場所で探す</label><input id="search" type="search" placeholder="例：チップ、塩、卸、工房"><div class="tabs" id="items" style="margin-top:16px"></div><div id="detail"></div></section><section class="panel"><div class="row"><h2>頼んだ記録</h2><span class="pill" id="count"></span></div><div id="orders" aria-live="polite"></div></section></div></main><footer class="footer"><nav aria-label="ほかの見本"><a href="03-video.html">← 前の見本</a><span>4 / 11</span><a href="04-calendar.html">次の見本 →</a></nav>燻製食堂クワガタは架空のお店です。人名・数値・記録はすべて見本用です。<br>操作はこの画面だけに反映されます。再読み込みすると元に戻ります。</footer></div><script>'use strict';const $=s=>document.querySelector(s);const items=[{"name": "サクラの燻製チップ", "cat": "燻煙材", "dept": "工房・ワークショップ", "who": "製造A", "from": "△△木材店", "how": "残り2袋で担当に確認。1kg入りを4袋、店の注文帳へ記入。"}, {"name": "リンゴの燻製チップ", "cat": "燻煙材", "dept": "工房・ワークショップ", "who": "製造A", "from": "△△木材店", "how": "講座用の小袋数を確認し、1kg入りを2袋、店の端末で注文。"}, {"name": "塩", "cat": "原材料", "dept": "工房", "who": "製造B", "from": "△△食品店", "how": "残り3kgで、5kg入りを1袋、注文帳へ記入。"}, {"name": "豚もも肉", "cat": "原材料", "dept": "食堂・工房", "who": "製造B", "from": "△△精肉店", "how": "週の製造計画と冷蔵庫の空きを確認し、担当者が10kgを注文。"}, {"name": "サバ切り身", "cat": "原材料", "dept": "食堂・工房", "who": "調理A", "from": "△△鮮魚店", "how": "昼定食の予定数を確認し、40切れの納品日を注文帳へ。"}, {"name": "チーズ", "cat": "原材料", "dept": "工房・燻製マルシェ", "who": "製造A", "from": "△△乳製品店", "how": "卸の受注数と店頭分を分けて計算し、1kg入りを6本注文。"}, {"name": "ミックスナッツ", "cat": "原材料", "dept": "工房・燻製マルシェ", "who": "製造B", "from": "△△食品店", "how": "試作分と販売分の残数を確認し、2kg入りを2袋注文。"}, {"name": "食品用小袋", "cat": "包装", "dept": "工房・燻製マルシェ", "who": "販売A", "from": "△△包装店", "how": "販売用100袋と講座用36袋を確認し、200枚を店の端末で注文。"}, {"name": "保冷資材セット", "cat": "出荷・梱包", "dept": "卸", "who": "出荷A", "from": "△△包装店", "how": "今週の卸12箱と予備3箱を確認し、15組を注文帳へ記入。"}, {"name": "出荷ラベル用紙", "cat": "出荷・梱包", "dept": "卸", "who": "出荷A", "from": "△△資材店", "how": "卸先別の必要枚数を確認し、100枚を店の端末で注文。"}];let picked=0,orders=[];function detail(){const x=items[picked];$('#detail').innerHTML=`<h3>${x.name}</h3><p><span class="muted">分類・使う場所</span>　${x.cat} ／ ${x.dept}</p><p><span class="muted">誰が</span>　${x.who}</p><p><span class="muted">どこから</span>　${x.from}（架空の仕入先）</p><div class="note"><strong>どう頼む</strong><br>${x.how}</div><p class="small">実際の注文や外部への送信は行いません。</p><button id="ordered" class="primary">頼んだ</button>`;$('#ordered').onclick=()=>{orders.unshift({name:x.name,who:x.who});renderOrders()}}function choices(){const q=$('#search').value.trim();$('#items').innerHTML=items.map((x,i)=>[x.name,x.cat,x.dept].join(' ').includes(q)?`<button data-item="${i}" class="${i===picked?'active':''}">${x.name}</button>`:'').join('')||'<p class="muted">該当する品目がありません。</p>';document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{picked=+b.dataset.item;choices();detail()});$('#detail').hidden=!items[picked].name.includes(q)}function renderOrders(){$('#count').textContent=orders.length+'件';$('#orders').innerHTML=orders.map((x,i)=>`<div class="listrow row"><strong>${x.name}</strong><span>${x.who}・受付 ${orders.length-i}</span><span class="pill good">頼んだ</span></div>`).join('')||'<p class="empty">「頼んだ」を押すと、ここに記録されます。</p>'}$('#search').oninput=choices;choices();detail();renderOrders();</script></body></html>
